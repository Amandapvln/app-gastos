<section class="content-receita">
  <header>
    <div>
      <h1>Adicionar receita</h1>
      <p>Adicione seus ganhos e salários</p>
    </div>

    <div class="content-receita--icon">
      <fa-icon [icon]="faDollarSign" />
    </div>
  </header>

  <form 
    [formGroup]="form"
    class="content-form-receitas"
    (ngSubmit)="onSubmit()">
    
    @if (successMessage) {
      <div class="alert alert-success">{{ successMessage }}</div>
    }
    @if (errorMessage) {
      <div class="alert alert-error">{{ errorMessage }}</div>
    }
    
    <div>
      <label for="receita-valor">Valor</label>
      <input 
        type="number" 
        id="receita-valor" 
        name="valor" 
        placeholder="1000,00"
        step="0.01"
        min="0.01"
        formControlName="valor" />
    </div>

    <div>
      <label for="receita-categoria">Categoria</label>
      <select 
        id="receita-categoria" 
        name="categoria"
        formControlName="categoria">
        <option value="">Selecione uma categoria</option>
        <option value="Salário">Salário</option>
        <option value="Freelance">Freelance</option>
        <option value="Outros">Outros</option>
      </select>
    </div>

    <div>
      <label for="receita-descricao">Descrição (opcional)</label>
      <input 
        type="text" 
        id="receita-descricao" 
        name="descricao"
        placeholder="Digite uma descrição"
        maxlength="50"
        formControlName="descricao" />
    </div>

    <div>
      <label for="receita-data">Data</label>
      <input 
        type="date" 
        id="receita-data" 
        name="data"
        formControlName="data" />
    </div>

    <button type="submit" [disabled]="isLoading || form.invalid" style="width: 100%;">+ Adicionar Receita</button>
  </form>
</section>
